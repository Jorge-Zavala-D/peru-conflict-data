minimum_pre_commit_version: "4.3.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format check
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: repository-data-policy
        name: repository data policy
        entry: uv run python scripts/check_git_data_policy.py --staged
        language: system
        pass_filenames: false
      - id: pyright
        name: pyright strict type check
        entry: uv run pyright
        language: system
        pass_filenames: false
      - id: pytest
        name: unit and integration tests
        entry: uv run pytest
        language: system
        pass_filenames: false
      - id: schema-drift
        name: generated JSON Schema drift
        entry: uv run python scripts/export_schemas.py --check
        language: system
        pass_filenames: false
