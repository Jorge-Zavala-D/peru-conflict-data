      "decision_id": "POSTMERGE-M2-02A-VERIFIED",
      "status": "APPROVED",
      "response": "APPROVE",
      "scope": "**APPROVE.**\n\nI accept the recovered protected-main M2-02A readiness identity:\n\n```text\nmerge:\n995b54115f94454fc81d4af36f138add43ba8614\n\ntree:\n67284c356125d4f9758dc28a9e6c92a45cab3553\n```\n\nincluding the documented recovery lineage following the accidental PR #14 revert and PR #15 restoration.\n\nThis approval accepts the recovered substantive M2-02A readiness tree and custody.\n\nIt does NOT authorize annotation launch."
    },
    {
      "decision_id": "ISOLATED-RUNTIME",
      "status": "APPROVED",
      "response": "APPROVE",
      "scope": "**APPROVE DESIGN ONLY.**\n\nApprove the isolated neutral annotator-runtime architecture, including:\n\n- canonical-validator allowlist projection;\n- isolated runtime source bundle;\n- separate neutral package view;\n- no repository fallback;\n- `python -I -S -B`;\n- separately pinned launcher;\n- separately pinned third-party dependency inventory;\n- Python-environment trust manifest;\n- interpreter identity;\n- standard-library/native-runtime inventory;\n- environment aggregate identity;\n- A/B identical Python-environment requirement;\n- explicit external OS/kernel/system-library/hardware trust boundary.\n\nMandatory limitation:\n\nThe currently measured Python environment is rehearsal evidence only.\n\nIts manifest remains:\n\n```text\nproduction_approved = false\n```\n\nActual launch requires **independent pre-execution provisioning and authentication of the production Python environment**.\n\nThe running Python process MUST NOT be treated as bootstrapping trust in the stdlib it already consumed.\n\nNo production environment is approved by this decision."
    },
    {
      "decision_id": "RUNTIME-NEUTRALITY",
      "status": "APPROVED",
      "response": "APPROVE",
      "scope": "**APPROVE.**\n\nApprove the demonstrated runtime/human-view neutrality architecture.\n\nThe human runtime may contain only the source-neutral allowlisted functionality needed for:\n\n- page display;\n- position conversion;\n- slot generation;\n- inspection-template generation;\n- draft validation.\n\nIt must not expose:\n\n- benchmark partition role;\n- parser-development/held-out/pilot labels;\n- parser predictions;\n- machine source answers;\n- machine prefill;\n- another annotator's work;\n- gold/adjudication data;\n- coordinator routing;\n- owner private metadata.\n\nCanonical/isolated validation equivalence remains mandatory.\n\nAny future divergence invalidates the launch candidate."
    },
    {
      "decision_id": "EXTERNAL-TOPOLOGY",
      "status": "APPROVED",
      "response": "APPROVE",
      "scope": "**APPROVE DESIGN ONLY.**\n\nApprove the proposed future external root:\n\n`06_validation/m2_benchmark/annotation_runs/m2-02-v1`\n\nand its reviewed logical areas for:\n\n- coordinator custody;\n- A issue;\n- A submission;\n- B issue;\n- B submission;\n- accepted locked A;\n- accepted locked B;\n- supersession;\n- comparison;\n- adjudication;\n- held-out sealed results;\n- coordinator receipts.\n\nThis approval authorizes the **layout/design only**.\n\nIt does NOT authorize:\n\n- folder creation;\n- Dropbox writes;\n- sharing changes;\n- invitations;\n- links;\n- test uploads;\n- package delivery.\n\nThose require a later exact operational authorization."
    },
    {
      "decision_id": "ELIGIBILITY-PROTOCOL",
      "status": "APPROVED",
      "response": "APPROVE",
      "scope": "**APPROVE DESIGN ONLY.**\n\nApprove the private distinct-human/exposure attestation protocol.\n\nA future annotator must be privately verified as:\n\n- a real human person;\n- assigned exactly one role;\n- distinct from the other annotator;\n- not exposed to the other annotator's work;\n- not exposed to machine-generated source answers/prefill;\n- not exposed to parser predictions;\n- not exposed to held-out labels or benchmark partition assignments;\n- not using ChatGPT, Codex or another model as the annotator.\n\nThe private eligibility record must bind the human to the exact:\n\n- run;\n- role;\n- original package;\n- reference identity;\n- neutral view;\n- runtime;\n- Python environment;\n- contract identity.\n\nNo actual person is approved or assigned by this decision.\n\nNo human PII belongs in Git."
    },
    {
      "decision_id": "AB-ACCESS-TEST-PROTOCOL",
      "status": "APPROVED",
      "response": "APPROVE",
      "scope": "**APPROVE V2 DESIGN ONLY.**\n\nApprove:\n\n`m2-02-real-access-tests-v2`\n\nand its typed least-privilege policy.\n\nThe policy currently derives:\n\n**108 ACL checks**\n\nfrom all:\n\n- 3 actors;\n- 12 logical resources;\n- 3 operations (`list`, `read`, `write`).\n\nApprove the following design principles:\n\n- A can list/read A issue area but cannot write it;\n- B can list/read B issue area but cannot write it;\n- each annotator can list/read/write their own private submission workspace;\n- each annotator is denied list/read/write on the other annotator's areas;\n- each annotator is denied list/read/write on all coordinator-only areas;\n- coordinator operational ACLs are allowed where required;\n- accepted locked A/B bytes use separate application/provenance immutability controls rather than falsely claiming coordinator ACL denial.\n\nHistorical v1 remains historical only.\n\nMandatory limitation:\n\n**All 108 real-account results remain NOT RUN.**\n\nThis decision approves only the test protocol.\n\nNo account-isolation result is approved or inferred."
    },
    {
      "decision_id": "HELDOUT-SEALING-LAUNCH-PROTOCOL",
      "status": "APPROVED",
      "response": "APPROVE",
      "scope": "**APPROVE DESIGN ONLY.**\n\nApprove coordinator-only partition routing and held-out sealing.\n\nFixed coordinator partition remains:\n\n```text\nprotocol pilots:\n264\n269\n\nparser development:\n260\n262\n266\n268\n\nheld-out evaluation:\n261\n263\n265\n267\n```\n\nHumans receive report identities/source material but no partition roles.\n\nHeld-out human labels must never enter parser-development workflows before the later authorized benchmark-evaluation stage.\n\nThis decision approves the sealing/routing design only.\n\nActual external permissions and account isolation remain untested."
    },
    {
      "decision_id": "ISSUANCE-CEREMONY",
      "status": "APPROVED",
      "response": "APPROVE",
      "scope": "**APPROVE DESIGN ONLY.**\n\nApprove the ordered fail-closed issuance ceremony.\n\nThe later real ceremony must require, in order, verified evidence for:\n\n1. protected-main launch authority;\n2. exact approved runtime;\n3. exact A/B original/neutral package identities;\n4. exact reference identity;\n5. private eligible human A;\n6. private eligible human B;\n7. two distinct people;\n8. all required real access checks;\n9. explicit external-write authority;\n10. exact external paths and permissions;\n11. role-specific eligibility bindings;\n12. role-specific issuance receipts;\n13. A issued only to A;\n14. B issued only to B;\n15. independent verification of delivered bytes;\n16. issue timestamp and recipient identity;\n17. only then annotation-start recording.\n\nIf any prerequisite fails, launch remains false.\n\nThis approval does NOT issue any package."
    },
    {
