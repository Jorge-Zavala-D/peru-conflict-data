      "response": "APPROVE",
      "scope": "**APPROVE DESIGN ONLY.**\n\nApprove the later production-lock prerequisites:\n\n- separate owner launch approval;\n- valid actual-human eligibility;\n- valid A/B isolation evidence;\n- exact issuance custody;\n- valid complete human submission;\n- complete report/object-family inspection;\n- all required human-declared slots resolved or explicitly unresolved;\n- explicit human lock confirmation;\n- separate coordinator lock confirmation;\n- no ambiguous supersession fork;\n- immutable parent preservation;\n- append-only supersession;\n- no in-place overwrite.\n\nCurrent production locking MUST remain disabled.\n\nThis approval does not enable locking."
