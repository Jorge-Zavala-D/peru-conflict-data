name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-admission:
    name: Native admitted startup (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      EXPECTED_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Native startup, trust-boundary and reporting regression gate
        timeout-minutes: 60
        run: uv run python scripts/ci_m2_gate.py run native-gate
      - name: Retain synthetic native diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-admission-${{ matrix.os }}-${{ matrix.python-version }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ci-evidence/native-gate/manifest.json
            ci-evidence/native-gate/metadata.json
            ci-evidence/native-gate/events.jsonl
            ci-evidence/native-gate/result.json
            ci-evidence/native-gate/result.xml

  quality:
    needs: native-admission
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      EXPECTED_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Require every native admitted startup to pass
        env:
          NATIVE_ADMISSION_RESULT: ${{ needs.native-admission.result }}
        run: test "$NATIVE_ADMISSION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright --pythonversion ${{ matrix.python-version }} --pythonplatform Windows
      - run: uv run pyright --pythonversion ${{ matrix.python-version }} --pythonplatform Linux
      - run: uv run python scripts/export_schemas.py --check
      - run: uv run python scripts/check_git_data_policy.py
      - name: Complete canonical selection with phase and JUnit receipts
        run: uv run python scripts/ci_m2_gate.py run all
        timeout-minutes: 300
      - name: Retain synthetic execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m2-linux-${{ matrix.python-version }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ci-evidence/all/manifest.json
            ci-evidence/all/metadata.json
            ci-evidence/all/events.jsonl
            ci-evidence/all/result.json
            ci-evidence/all/result.xml

  windows-preflight:
    needs: native-admission
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      UV_PYTHON: "3.12"
      EXPECTED_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/export_schemas.py --check
      - run: uv run python scripts/check_git_data_policy.py
      - name: Native Windows handle smoke tests (separate coverage)
        run: uv run python scripts/ci_m2_gate.py run smoke
      - name: Acquisition safety tests (separate coverage)
        run: uv run python scripts/ci_m2_gate.py run acquisition
      - name: Canonical current default pytest selection
        run: uv run python scripts/ci_m2_gate.py collect
      - name: Retain canonical plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m2-win-plan
          if-no-files-found: error
          retention-days: 14
          path: |
            ci-evidence/plan/manifest.json
            ci-evidence/plan/metadata.json
            ci-evidence/plan/events.jsonl
      - name: Retain synthetic preflight diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m2-windows-preflight
          if-no-files-found: error
          retention-days: 14
          path: |
            ci-evidence/smoke/manifest.json
            ci-evidence/smoke/metadata.json
            ci-evidence/smoke/events.jsonl
            ci-evidence/smoke/result.json
            ci-evidence/smoke/result.xml
            ci-evidence/acquisition/manifest.json
            ci-evidence/acquisition/metadata.json
            ci-evidence/acquisition/events.jsonl
            ci-evidence/acquisition/result.json
            ci-evidence/acquisition/result.xml

  windows-tests:
    name: Windows full suite (${{ matrix.shard }})
    needs: windows-preflight
    runs-on: windows-latest
    # A five-hour step budget leaves 30 minutes for setup and always() receipts.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [operator, cleanup-0, cleanup-1, cleanup-2, remainder]
    env:
      UV_PYTHON: "3.12"
      EXPECTED_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Execute whole tests from the canonical selection
        run: uv run python scripts/ci_m2_gate.py run ${{ matrix.shard }}
        timeout-minutes: 300
      - name: Retain synthetic shard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m2-win-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ci-evidence/${{ matrix.shard }}/manifest.json
            ci-evidence/${{ matrix.shard }}/metadata.json
            ci-evidence/${{ matrix.shard }}/events.jsonl
            ci-evidence/${{ matrix.shard }}/result.json
            ci-evidence/${{ matrix.shard }}/result.xml

  windows-acquisition-safety:
    name: windows-acquisition-safety
    if: always()
    needs: [windows-preflight, windows-tests]
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.12"
      EXPECTED_PYTHON: "3.12"
      CI_NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: m2-win-*
          path: ci-artifacts
      - name: Reject incomplete dependencies and reconcile exact coverage
        run: uv run python scripts/ci_m2_gate.py aggregate ci-artifacts
